version: "3.8"

# 单节点 Kafka，KRaft 模式（Kafka新版本自带的元数据管理机制，不再需要额外部署 Zookeeper），
# 本地学习/开发用足够了，一条命令启动。
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-demo
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-demo:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # 顺手带一个 Redis，幂等消费demo需要用到（如果你已经在跑之前redis-demo用的redis，
  # 端口冲突的话把下面的 6379 改成别的端口，同时改 application.yml 里的 spring.data.redis.port）
  redis:
    image: redis:7
    container_name: redis-for-kafka-demo
    ports:
      - "6379:6379"
